<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe5"><title>Bookends Admin</title>
<style>
:root{--ink:#17211d;--paper:#f4efe5;--card:#fffaf1;--line:#d9d0c1;--accent:#df735c;--green:#416657}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;padding:18px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font:800 28px Georgia,serif}.tiny{font-size:12px;opacity:.65}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.item{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}h1,h2,h3{font-family:Georgia,serif}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit}textarea{min-height:80px;resize:vertical}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:10px}.row>*{flex:1}button{border:0;border-radius:13px;padding:14px 16px;font-weight:800;font-size:15px;background:var(--ink);color:white;cursor:pointer}.wide{width:100%}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.publish{background:var(--green)}.danger{background:var(--accent)}.status{padding:10px 12px;border-radius:10px;background:#eee5d7;margin:12px 0;font-size:14px}.hidden{display:none}@media(max-width:520px){.answers,.row{grid-template-columns:1fr;display:grid}}
</style></head><body><main class="app">
<header><div><div class="brand">bookends</div><div class="tiny">admin</div></div><a href="../" style="color:inherit">View site</a></header>
<section id="login" class="card"><h1>Admin login</h1><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><br><br><button id="loginBtn" class="wide">Log in</button><div id="loginStatus"></div></section>
<section id="editor" class="hidden">
<div class="row"><button id="newBtn" class="secondary">New day</button><button id="logoutBtn" class="secondary">Log out</button></div>
<div class="card"><h2>Daily five</h2><label>Date</label><input id="date" type="date"><label>Title</label><input id="title"><label>Intro</label><textarea id="intro"></textarea><div id="items"></div><div id="status" class="status">Draft not saved.</div><div class="row"><button id="saveBtn">Save draft</button><button id="publishBtn" class="publish">Publish</button></div></div>
</section></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://gsqzjumawdvzvygzpctu.supabase.co","sb_publishable_ymkB1pB3WCQisADza7u1Ww_iOMdVqdt");
const $=id=>document.getElementById(id);let currentDayId=null;
function status(t){$("status").textContent=t}
function makeItems(){const root=$("items");root.innerHTML="";for(let i=0;i<5;i++){const d=document.createElement("div");d.className="item";d.innerHTML='<h3>'+(i+1)+'</h3><label>Question</label><textarea class="prompt"></textarea><label>Answers</label><div class="answers">'+[0,1,2,3].map(j=>'<input class="answer" placeholder="'+String.fromCharCode(65+j)+'">').join("")+'</div><label>Correct answer</label><select class="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><label>Explanation</label><textarea class="explanation"></textarea>';root.appendChild(d)}}
function blank(){currentDayId=null;$("date").value=new Date().toISOString().slice(0,10);$("title").value="Five good minutes";$("intro").value="Five little things worth knowing today.";makeItems();status("New draft.")}
async function loadDate(){const date=$("date").value;if(!date)return;const {data,error}=await sb.from("days").select("*,items(*)").eq("date",date).maybeSingle();if(error){status(error.message);return}if(!data){currentDayId=null;makeItems();status("No saved day for this date.");return}currentDayId=data.id;$("title").value=data.title;$("intro").value=data.intro;makeItems();const rows=[...document.querySelectorAll(".item")];(data.items||[]).sort((a,b)=>a.position-b.position).forEach((x,i)=>{if(!rows[i])return;rows[i].querySelector(".prompt").value=x.prompt||"";rows[i].querySelectorAll(".answer").forEach((a,j)=>a.value=(x.options||[])[j]||"");rows[i].querySelector(".correct").value=x.correct_index??0;rows[i].querySelector(".explanation").value=x.explanation||""});status(data.status==="published"?"Published.":"Draft saved.")}
function collect(){return [...document.querySelectorAll(".item")].map((r,i)=>({position:i+1,type:"trivia",prompt:r.querySelector(".prompt").value.trim(),options:[...r.querySelectorAll(".answer")].map(a=>a.value.trim()),correct_index:Number(r.querySelector(".correct").value),explanation:r.querySelector(".explanation").value.trim()}))}
async function save(publish){status("Saving…");const date=$("date").value,title=$("title").value.trim(),intro=$("intro").value.trim();if(!date||!title){status("Date and title are required.");return}const dayPayload={date,title,intro,status:publish?"published":"draft",published_at:publish?new Date().toISOString():null};let res;if(currentDayId)res=await sb.from("days").update(dayPayload).eq("id",currentDayId).select().single();else res=await sb.from("days").insert(dayPayload).select().single();if(res.error){status(res.error.message);return}currentDayId=res.data.id;let del=await sb.from("items").delete().eq("day_id",currentDayId);if(del.error){status(del.error.message);return}const items=collect().map(x=>({...x,day_id:currentDayId}));let ins=await sb.from("items").insert(items);if(ins.error){status(ins.error.message);return}status(publish?"Published — live site will use this day.":"Draft saved.");}
$("loginBtn").addEventListener("click",async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginStatus").textContent=error?error.message:"";if(!error)showEditor()});
$("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});$("newBtn").addEventListener("click",blank);$("date").addEventListener("change",loadDate);$("saveBtn").addEventListener("click",()=>save(false));$("publishBtn").addEventListener("click",()=>save(true));
async function showEditor(){$("login").classList.add("hidden");$("editor").classList.remove("hidden");blank();await loadDate()}
makeItems();const {data:{session}}=await sb.auth.getSession();if(session)showEditor();
</script></body></html>
