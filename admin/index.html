<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bookends Admin</title><style>
:root{--ink:#17211d;--paper:#f4efe5;--card:#fffaf1;--line:#d9d0c1;--green:#416657}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui}.app{max-width:760px;margin:auto;padding:18px 18px 100px}header,.row{display:flex;gap:10px;justify-content:space-between;align-items:center}header{margin-bottom:24px}.brand,h1,h2,h3{font-family:Georgia,serif}.brand{font-size:28px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.item{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px;text-transform:uppercase}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit}textarea{min-height:72px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;background:var(--ink);color:white;cursor:pointer}.row>*{flex:1}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.publish{background:var(--green)}.status{padding:10px 12px;background:#eee5d7;border-radius:10px;margin:12px 0}.hidden{display:none}.imgPreview{max-width:100%;max-height:220px;border-radius:12px;margin-top:8px}@media(max-width:520px){.answers,.row{display:grid;grid-template-columns:1fr}}
</style></head><body><main class="app"><header><div><div class="brand">bookends</div><small>admin</small></div><a href="../">View site</a></header>
<section id="login" class="card"><h1>Admin login</h1><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><br><br><button id="loginBtn">Log in</button><p id="loginStatus"></p></section>
<section id="editor" class="hidden"><div class="row"><button id="newBtn" class="secondary">New day</button><button id="logoutBtn" class="secondary">Log out</button></div><div class="card"><h2>Daily five</h2><label>Date</label><input id="date" type="date"><label>Title</label><input id="title"><label>Intro</label><textarea id="intro"></textarea><div id="items"></div><div id="status" class="status">Draft not saved.</div><div class="row"><button id="saveBtn">Save draft</button><button id="publishBtn" class="publish">Publish</button></div></div></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const sb=createClient("https://gsqzjumawdvzvygzpctu.supabase.co","sb_publishable_ymkB1pB3WCQisADza7u1Ww_iOMdVqdt"),$=id=>document.getElementById(id);let currentDayId=null;const TYPES=["trivia","poll","good_news","visual","puzzle","wildcard"];
function stat(t){$("status").textContent=t}function localDate(){let d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),x=String(d.getDate()).padStart(2,"0");return d.getFullYear()+"-"+m+"-"+x}
function rowHTML(i){return '<div class="item"><h3>'+(i+1)+'</h3><label>Type</label><select class="type">'+TYPES.map(t=>'<option value="'+t+'">'+t.replace("_"," ")+'</option>').join("")+'</select><label>Prompt / headline</label><textarea class="prompt"></textarea><label>Choices</label><div class="answers">'+[0,1,2,3].map((_,j)=>'<input class="answer" placeholder="'+String.fromCharCode(65+j)+'">').join("")+'</div><label>Correct answer <span class="correctHint">(ignored for polls)</span></label><select class="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><label>Reveal / explanation</label><textarea class="explanation"></textarea><label>Image</label><input class="image" type="file" accept="image/*"><input class="imageUrl" type="hidden"><img class="imgPreview hidden"></div>'}
function makeItems(){ $("items").innerHTML=Array.from({length:5},(_,i)=>rowHTML(i)).join("")}
function blank(){currentDayId=null;$("date").value=localDate();$("title").value="Five good minutes";$("intro").value="Five little things worth knowing today.";makeItems();stat("New draft.")}
async function upload(row,i){let f=row.querySelector(".image").files[0],old=row.querySelector(".imageUrl").value;if(!f)return old;let ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,""),path=$("date").value+"/"+(i+1)+"-"+Date.now()+"."+ext;let u=await sb.storage.from("bookends").upload(path,f,{upsert:false});if(u.error)throw u.error;return sb.storage.from("bookends").getPublicUrl(path).data.publicUrl}
async function collect(){let rows=[...document.querySelectorAll(".item")],out=[];for(let i=0;i<rows.length;i++){let r=rows[i],type=r.querySelector(".type").value;out.push({position:i+1,type,prompt:r.querySelector(".prompt").value.trim(),options:[...r.querySelectorAll(".answer")].map(a=>a.value.trim()).filter(Boolean),correct_index:type==="poll"?null:Number(r.querySelector(".correct").value),explanation:r.querySelector(".explanation").value.trim(),image_url:await upload(r,i)})}return out}
async function loadDate(){let date=$("date").value;if(!date)return;let {data,error}=await sb.from("days").select("*,items(*)").eq("date",date).maybeSingle();if(error){stat(error.message);return}if(!data){currentDayId=null;makeItems();stat("No saved day for this date.");return}currentDayId=data.id;$("title").value=data.title;$("intro").value=data.intro;makeItems();let rows=[...document.querySelectorAll(".item")];(data.items||[]).sort((a,b)=>a.position-b.position).forEach((x,i)=>{let r=rows[i];r.querySelector(".type").value=x.type||"trivia";r.querySelector(".prompt").value=x.prompt||"";r.querySelectorAll(".answer").forEach((a,j)=>a.value=(x.options||[])[j]||"");r.querySelector(".correct").value=x.correct_index??0;r.querySelector(".explanation").value=x.explanation||"";r.querySelector(".imageUrl").value=x.image_url||"";if(x.image_url){let im=r.querySelector(".imgPreview");im.src=x.image_url;im.classList.remove("hidden")}});stat(data.status==="published"?"Published.":"Draft saved.")}
async function save(pub){try{stat("Saving…");let p={date:$("date").value,title:$("title").value.trim(),intro:$("intro").value.trim(),status:pub?"published":"draft",published_at:pub?new Date().toISOString():null},res=currentDayId?await sb.from("days").update(p).eq("id",currentDayId).select().single():await sb.from("days").insert(p).select().single();if(res.error)throw res.error;currentDayId=res.data.id;let items=await collect(),del=await sb.from("items").delete().eq("day_id",currentDayId);if(del.error)throw del.error;let ins=await sb.from("items").insert(items.map(x=>({...x,day_id:currentDayId})));if(ins.error)throw ins.error;stat(pub?"Published — it's live.":"Draft saved.")}catch(e){stat(e.message||String(e))}}
$("loginBtn").onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginStatus").textContent=error?error.message:"";if(!error)show()};$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};$("newBtn").onclick=blank;$("date").onchange=loadDate;$("saveBtn").onclick=()=>save(false);$("publishBtn").onclick=()=>save(true);async function show(){$("login").classList.add("hidden");$("editor").classList.remove("hidden");blank();await loadDate()}makeItems();let{data:{session}}=await sb.auth.getSession();if(session)show();
</script></body></html>
