<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe5"><title>Bookends — Daily Five</title><style>
:root{--ink:#17211d;--paper:#f4efe5;--card:#fffaf1;--line:#d9d0c1;--accent:#df735c;--green:#416657}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;min-height:100dvh;padding:18px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font:800 27px Georgia,serif;letter-spacing:-1px}.tiny{font-size:12px;opacity:.6}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 8px 30px #3d32230b}.hero{padding:35px 24px;text-align:center}.star{font-size:58px;display:block;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}h1,h2{font-family:Georgia,serif;line-height:1.05;margin:12px 0}h1{font-size:42px}h2{font-size:30px}button{border:0;border-radius:15px;padding:15px 18px;font-weight:750;font-size:16px;background:var(--ink);color:white;width:100%;cursor:pointer}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.choice{background:white;color:var(--ink);border:1px solid var(--line);margin:7px 0;text-align:left}.choice.good{border-color:#548c70;background:#edf7f0}.choice.bad{border-color:#d07b6b;background:#fff0ed}.progress{display:flex;gap:6px;margin:14px 0 24px}.progress i{height:5px;flex:1;border-radius:5px;background:#ddd4c7}.progress i.on{background:var(--green)}.explain{border-left:3px solid var(--accent);padding-left:12px;margin:15px 0}.share{font-size:22px}.score{font:700 72px Georgia,serif;margin:0}.tag{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:800}</style></head><body><main class="app" id="app"></main><script>
let day;let step=-1,score=0,answered=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function init(){try{day=await fetch('day.json?'+Date.now()).then(r=>r.json())}catch(e){document.querySelector('#app').innerHTML='<p>Today’s five is being prepared.</p>';return}showPlay()}
function shell(x){$('#app').innerHTML=`<header><div><div class="brand">bookends</div><div class="tiny">a daily five</div></div><div class="tiny">${esc(day.date)}</div></header>${x}`}
function showPlay(){step=-1;score=0;shell(`<section class="card hero"><span class="star">⭐</span><div class="tag">TODAY'S FIVE</div><h1>${esc(day.title)}</h1><p>${esc(day.intro)}</p><br><button onclick="next()">Start today's five</button><p class="tiny">No login. About five minutes.</p></section>`)}
function next(){step++;answered=false;if(step>=day.items.length)return finish();renderQ()}
function renderQ(){let x=day.items[step];shell(`<div class="progress">${day.items.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><section class="card"><div class="tag">${step+1} OF ${day.items.length}</div><h2>${esc(x.q)}</h2><div id="choices">${x.a.map((v,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><div id="feedback"></div></section>`)}
function answer(i){if(answered)return;answered=true;let x=day.items[step];if(i===+x.correct)score++;[...document.querySelectorAll('.choice')].forEach((el,j)=>el.classList.add(j===+x.correct?'good':j===i?'bad':''));$('#feedback').innerHTML=`<div class="explain"><b>${i===+x.correct?'Yep.':'Not quite.'}</b><br>${esc(x.why)}</div><button onclick="next()">${step===day.items.length-1?'See my finish':'Next'}</button>`}
function finish(){shell(`<section class="card hero"><span class="star">⭐</span><div class="tag">THAT'S YOUR FIVE</div><p class="score">${score}/${day.items.length}</p><h2>See you tomorrow.</h2><p>The sea star has absolutely nothing productive to add.</p><button class="share" onclick="shareResult()">Share ${score}/${day.items.length}</button><br><br><button class="secondary" onclick="showPlay()">Play again</button></section>`)}
async function shareResult(){let text=`Bookends — ${score}/${day.items.length} today ⭐\nFive good minutes.`;if(navigator.share)try{await navigator.share({title:'Bookends',text,url:location.href})}catch(e){}else{await navigator.clipboard.writeText(text+' '+location.href);alert('Result copied!')}}
init();</script></body></html>
