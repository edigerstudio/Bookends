<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe5">
<title>Bookends — Daily Five</title>
<style>
:root{--ink:#17211d;--paper:#f4efe5;--card:#fffaf1;--line:#d9d0c1;--accent:#df735c;--green:#416657}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:auto;min-height:100dvh;padding:18px 18px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font:800 27px Georgia,serif;letter-spacing:-1px}.tiny{font-size:12px;opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 8px 30px #3d32230b}.hero{padding:35px 24px;text-align:center}
.star{font-size:58px;display:block}h1,h2{font-family:Georgia,serif;line-height:1.05;margin:12px 0}h1{font-size:42px}h2{font-size:30px}
button{border:0;border-radius:15px;padding:15px 18px;font-weight:750;font-size:16px;background:var(--ink);color:white;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}.choice{background:white;color:var(--ink);border:1px solid var(--line);margin:7px 0;text-align:left}.choice.good{border-color:#548c70;background:#edf7f0}.choice.bad{border-color:#d07b6b;background:#fff0ed}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.progress{display:flex;gap:6px;margin:14px 0 24px}.progress i{height:5px;flex:1;border-radius:5px;background:#ddd4c7}.progress i.on{background:var(--green)}
.explain{border-left:3px solid var(--accent);padding-left:12px;margin:15px 0}.score{font:700 72px Georgia,serif;margin:0}.tag{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:800}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
var day=null, step=-1, score=0;
var app=document.getElementById("app");

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clear(){while(app.firstChild)app.removeChild(app.firstChild)}
function header(){var h=el("header");var left=el("div");left.append(el("div","brand","bookends"),el("div","tiny","a daily five"));h.append(left,el("div","tiny",day.date));app.appendChild(h)}
function button(label,fn,cls){var b=el("button",cls||"",label);b.type="button";b.addEventListener("click",fn,false);return b}

function home(){
 step=-1;score=0;clear();header();
 var card=el("section","card hero");
 card.append(el("span","star","⭐"),el("div","tag","TODAY'S FIVE"),el("h1","",day.title),el("p","",day.intro),el("br"));
 card.append(button("Start today's five",next));
 card.append(el("p","tiny","No login. About five minutes."));
 app.appendChild(card);
}
function next(){step+=1;if(step>=day.items.length){finish();return}question()}
function question(){
 clear();header();
 var prog=el("div","progress");
 day.items.forEach(function(_,i){prog.appendChild(el("i",i<=step?"on":""))});app.appendChild(prog);
 var x=day.items[step],card=el("section","card");
 card.append(el("div","tag",(step+1)+" OF "+day.items.length),el("h2","",x.q));
 var choices=el("div");
 x.a.forEach(function(label,i){
   var b=button(String.fromCharCode(65+i)+". "+label,function(){answer(i,choices,feedback)});
   b.className="choice";choices.appendChild(b);
 });
 var feedback=el("div");
 card.append(choices,feedback);app.appendChild(card);
}
function answer(selected,choices,feedback){
 var x=day.items[step],buttons=choices.querySelectorAll("button");
 buttons.forEach(function(b,i){b.disabled=true;if(i===Number(x.correct))b.classList.add("good");else if(i===selected)b.classList.add("bad")});
 if(selected===Number(x.correct))score+=1;
 var box=el("div","explain");box.append(el("b","",selected===Number(x.correct)?"Yep.":"Not quite."),document.createElement("br"),document.createTextNode(x.why));
 feedback.append(box,button(step===day.items.length-1?"See my finish":"Next",next));
}
function finish(){
 clear();header();var card=el("section","card hero");
 card.append(el("span","star","⭐"),el("div","tag","THAT'S YOUR FIVE"),el("p","score",score+"/"+day.items.length),el("h2","","See you tomorrow."),el("p","","The sea star has absolutely nothing productive to add."));
 card.append(button("Share "+score+"/"+day.items.length,shareResult),el("br"),el("br"),button("Play again",home,"secondary"));app.appendChild(card);
}
function shareResult(){
 var text="Bookends — "+score+"/"+day.items.length+" today ⭐\nFive good minutes.";
 if(navigator.share){navigator.share({title:"Bookends",text:text,url:location.href}).catch(function(){})}
 else if(navigator.clipboard){navigator.clipboard.writeText(text+" "+location.href).then(function(){alert("Result copied!")})}
}
fetch("./day.json?v=5",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){day=d;home()}).catch(function(e){clear();app.append(el("h2","","Couldn't load today's five."),el("p","",String(e.message)))});
</script>
</body>
</html>
